[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleuth"
version = "3.0.0"
description = "OSINT tool: find accounts, analyze profiles, export threat intel (Sherlock + Maigret + SpiderFoot style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9", "pillow>=10"]

[project.optional-dependencies]
tor = ["aiohttp-socks>=0.8"]
dev = ["pytest>=8"]
xlsx = ["openpyxl>=3.1"]      # multi-sheet Excel export
all = ["aiohttp-socks>=0.8", "openpyxl>=3.1"]

[project.scripts]
sleuth = "sleuth.cli:main"

[tool.setuptools]
packages = ["sleuth", "sleuth.scan", "sleuth.scan.modules"]

[tool.setuptools.package-data]
sleuth = ["data/*.json", "static/*"]

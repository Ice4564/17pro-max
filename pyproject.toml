[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleuth"
version = "1.1.0"
description = "Find accounts by username across many sites (Sherlock + Maigret style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9", "pillow>=10"]

[project.optional-dependencies]
tor = ["aiohttp-socks>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
sleuth = "sleuth.cli:main"

[tool.setuptools]
packages = ["sleuth", "sleuth.scan", "sleuth.scan.modules"]

[tool.setuptools.package-data]
sleuth = ["data/*.json", "static/*"]
